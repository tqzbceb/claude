<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root{ --bg:#faf9f5; --ink:#1f1e1c; --dim:#6b665d; --line:#e6e2d8;
         --accent:#c96442; --ok:#3f7d58; --warn:#9a6a1f; --bad:#c0392b; }
  *{box-sizing:border-box}
  body{width:340px;margin:0;background:var(--bg);color:var(--ink);
       font:13px/1.55 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  header{padding:12px 14px 10px;border-bottom:1px solid var(--line);display:flex;
         align-items:center;gap:9px}
  .dot{width:11px;height:11px;border-radius:50%;background:#c8c3b8;flex:0 0 11px}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
  h1{font-size:14px;margin:0;font-weight:600}
  #sum{margin:2px 0 0;font-size:12px;color:var(--dim)}
  main{padding:10px 14px 4px}
  .row{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid #efece3;align-items:flex-start}
  .row:last-child{border-bottom:0}
  .ico{flex:0 0 15px;text-align:center;font-weight:700;font-size:12px;line-height:1.5}
  .ico.ok{color:var(--ok)} .ico.warn{color:var(--warn)} .ico.bad{color:var(--bad)}
  .k{flex:0 0 88px;color:var(--dim)}
  .v{flex:1;word-break:break-all}
  .fix{margin:8px 0 2px;padding:9px 11px;border-radius:7px;background:#fdf3ee;
       border:1px solid #f0d5c8;font-size:12.5px;line-height:1.6}
  .fix b{color:var(--accent)}
  .fix.good{background:#f4f6f2;border-color:#d8e0d2}
  .fix ol{margin:5px 0 0;padding-left:18px}
  footer{padding:9px 14px 13px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  button{font:inherit;padding:5px 10px;border-radius:6px;border:1px solid var(--line);
         background:#fff;color:var(--ink);cursor:pointer}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.p{background:var(--accent);border-color:var(--accent);color:#fff}
  button.p:hover{opacity:.9;color:#fff}
  input{font:inherit;width:56px;padding:4px 6px;border:1px solid var(--line);border-radius:6px}
  .tiny{font-size:11.5px;color:var(--dim)}
  code{background:#f2efe7;border-radius:3px;padding:0 3px;font-size:11.5px}
</style>
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <div>
      <h1 id="title">正在检测…</h1>
      <p id="sum"></p>
    </div>
  </header>

  <main>
    <div class="row"><span class="ico" id="i1">·</span><span class="k">dcwatch 程序</span><span class="v" id="v1">检测中</span></div>
    <div class="row"><span class="ico" id="i2">·</span><span class="k">Discord 标签页</span><span class="v" id="v2">检测中</span></div>
    <div class="row"><span class="ico" id="i3">·</span><span class="k">投递</span><span class="v" id="v3">检测中</span></div>
    <div class="row"><span class="ico" id="i4">·</span><span class="k">服务端看到</span><span class="v" id="v4">检测中</span></div>
    <div id="fix"></div>
  </main>

  <footer>
    <button class="p" id="open">打开 dcwatch 界面</button>
    <button id="again">重新检测</button>
    <button id="test">发测试消息</button>
    <span class="tiny">端口</span><input id="port" type="number" min="1" max="65535">
    <button id="save">保存</button>
    <span class="tiny" id="stamp"></span>
    <div class="tiny" id="msg" style="flex:0 0 100%"></div>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
